[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccweb"
version = "0.1.0"
description = "Personal terminal client for your Claude Code cloud sessions (unofficial)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=1.0", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ccweb = "ccweb.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ccweb"]
