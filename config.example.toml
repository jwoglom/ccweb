# Copy to ~/.config/ccweb/config.toml and change only what you need.

[api]
base_url = "https://api.anthropic.com"
anthropic_version = "2023-06-01"
anthropic_beta = "ccr-byoc-2025-07-29"
send_org_header = true
# Undocumented. Replace with what `ccweb probe` or tools/mitm_capture.py shows.
list_sessions = "GET /v1/sessions"
list_events = "GET /v1/sessions/{id}/events"
get_session = "GET /v1/sessions/{id}"
list_environments = "GET /v1/environment_providers"
create_session = "POST /v1/sessions"
timeout_seconds = 20

[poll]
sessions_seconds = 30   # how often the session list refreshes
events_seconds = 5      # how often the open conversation refreshes

[claude]
bin = "claude"
# Team/Enterprise self-hosted environment (ccpool_...). Leave empty for Anthropic-hosted.
environment_id = ""

[auth]
keychain_service = "Claude Code-credentials"   # macOS only

[new_session]
# Starting points for the new-session form. What you last chose there wins over these.
environment = ""             # environment name or ID; empty uses your last session's, else "Default", else the first
model = "claude-sonnet-5-5"
effort = "medium"            # low, medium, high, xhigh, max, or "" for the model's own default
permission_mode = "auto"     # auto, default, acceptEdits, plan
# [label, id] pairs for the model picker. Models your existing sessions use are added automatically.
models = [
  ["Fable 5.1", "claude-fable-5-1"],
  ["Opus 5.5", "claude-opus-5-5"],
  ["Opus 5.5 (1M context)", "claude-opus-5-5[1m]"],
  ["Sonnet 5.5", "claude-sonnet-5-5"],
  ["Haiku 5.5", "claude-haiku-5-5"],
]
